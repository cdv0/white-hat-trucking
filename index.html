
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Hat Trucking</title>
    <script type="module" src="./main.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@400;500;600;700;800&family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="./wht.svg">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="page">

<!-- HEADER -->
        <header class="header alignment" >
            <a href="#home">
                <img class="header-icon" src="./wht.svg"/>
            </a>

            <div class="header-right">
                <ul class="header-nav nav">
                    <li class="nav-list-item"><a class="nav-link header-nav-link" href="#about-us">ABOUT US</a></li>
                    <li class="nav-list-item"><a class="nav-link header-nav-link" href="#services">SERVICES</a></li>
                </ul>

                <a class="btn btn-primary" href="#contact">CONTACT ME →</a>
            </div>
        </header>

<!-- MAIN CONTENT-->

<!-- HERO PAGE-->
        <section id="home" class="hero section alignment">
            <div class="container">
                <h1 class="hero-title" data-content="hero.text"></h1>
                <h1 class="hero-title text-secondary" data-content="hero.subtext"></h1>
            </div>

            <div class="container-controls">
                <a class="btn btn-primary" href="#about-us">READ MORE →</a>
                <a class="btn btn-outline" href="#contact">CONTACT ME</a>
            </div>
        </section>

        <hr />

<!-- ABOUT US PAGE -->
         <section id="about-us" class="about-us section alignment">
            <div class="container-about-us-left">
                <img src="./truck2.jpg" height="480px" width="580px" style="object-fit: cover; object-position: center;">
            </div>

            <div class="container-about-us-right">
                <h2>ABOUT US</h2>
                <p class="body" data-content="about.description"></p>

                <div class="container-bring-to-table">
                    <h3>WHAT I BRING TO THE TABLE</h3>

                    <div id="features-list"></div>
                </div>
            </div>
         </section>

         <hr/>

<!-- SERVICES PAGE -->
          <section id="services" class="services section alignment">
            <h2>SERVICES</h2>

            <div id="services-list"></div>

            <div class="container-move-freight-1">
                <div class="move-freight-left">
                    <h3 data-content="move_freight_1.label"></h3>
                    <p class="subtext" data-content="move_freight_1.text"></p>
                </div>

                <a class="btn btn-primary" href="#contact">CONTACT ME</a>
            </div>
          </section>

          <hr/>

          <section id="contact" class="section contact alignment">
            <div class="container-contact">
                <div class="contact-left">
                    <h1 class="text-dark title-small" data-content="move_freight_2.label">?</h1>
                    <p class="subtext subtext-dark" data-content="move_freight_2.text"></p>

                    <form class="container-inputs">
                        <input type="text" name="name" placeholder="NAME" required>

                        <input type="email" name="email" placeholder="EMAIL" required>

                        <div class="textarea-wrapper">
                            <textarea
name="inquiry"
placeholder="INQUIRY"
maxlength="300"
                            ></textarea>
                            <span class="char-count">0/300</span>
                        </div>
                    </form>

                    <div class="container-controls">
                        <button class="btn btn-primary">SUBMIT</button>
                        <button class="btn btn-ghost">CLEAR</button>
                    </div>
                </div>

                <div class="contact-right">
                    <img src="road.jpg" width="400px" height="360px" style="object-fit: cover; border-radius: 4px;"/>
                </div>
            </div>
          </section>

          <hr/>

          <footer class="footer alignment">
            <div class="footer-top">
                <div class="footer-left">
                    <h1 class="footer-title" data-content="company.name"></h1>
                    <p class="subtext" data-content="footer.text"></p>
                    <p class="footer-id" data-content="footer.id_text"></p>
                </div>

                <div class="footer-navigation">
                    <p id="footer-navigation-title">NAVIGATION</p>

                    <ul class="footer-nav">
                        <li><a href="#about-us">About Us</a></li>
                        <li><a href="#services">Services</a></li>
                        <li><a href="#contact">Contact</a></li>
                    </ul>
                </div>
            </div>

            <div class="footer-divider"></div>

            <div class="footer-bot">
                <p class="footer-notes" data-content="footer.rights"></p>
            </div>
          </footer>

    </div>
</body>
</html>
